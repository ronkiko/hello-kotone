name: v3.main.8.10 Yuna pusher recoil check
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v3-main-8-10-yuna-pusher.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip libgl1 libxcursor1 libxinerama1 libxi6 libxrandr2 libxrender1 libpulse0
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp
          mv /tmp/Godot_v4.7.2-stable_linux.x86_64 /tmp/godot
          chmod +x /tmp/godot
      - name: Import resources
        run: /tmp/godot --headless --path godot --editor --quit
      - name: Owner prediction
        run: /tmp/godot --headless --path godot --script res://tests/mmo/owner_prediction_check.gd
      - name: Character presentation
        run: /tmp/godot --headless --path godot --script res://tests/mmo/character_presentation_check.gd
